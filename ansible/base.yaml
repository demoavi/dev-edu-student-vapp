---
# needs: controller
# First steps for one Avi controller: (1) make sure the admin password is the one we want,
# (2) system configuration: DNS and NTP servers, welcome workflow done, license tier,
# (3) create the SSH cloud connector user the Linux Server Cloud will use to reach the Ubuntu hosts,
# (4) set the configuration backup passphrase (the admin password).
# Derived from dev-avi-edu's build/ansible/sa/sa.yaml. Variables come from ../run.sh through an
# extra-vars file built from the CR's `ansible` block: controller and avi_version are derived from
# the controller VM, the rest (avi_username, avi_password, avi_old_password, lsc_private_key) are given
# there. Safe to re-run: if the new password already logs in it is not changed again.
# Optional variables: dns_servers / ntp_servers (lists of IPv4 addresses; default: the controller's own
# default gateway, `controller_gateway`, derived from its default-gw OVF property - the lab router
# answers both), dns_search_domain (default none), license_tier (default: ENTERPRISE unless both
# jwt_token and account_id are given - then the controller's own default, with Cloud Services, stays).
# NOT TESTED against a controller yet.
- hosts: localhost
  gather_facts: false
  collections:
    - vmware.alb

  tasks:
    - name: All required variables are set (and none is still a <placeholder>)
      ansible.builtin.assert:
        that:
          - controller is defined and controller | length > 0
          - avi_version is defined and avi_version | length > 0
          - avi_username is defined and avi_username | length > 0
          - avi_password is defined and avi_password | length > 0 and avi_password is not match('^<.*>$')
          - avi_old_password is defined and avi_old_password | length > 0
        fail_msg: "controller, avi_version, avi_username, avi_password and avi_old_password must be set for site {{ site | default('?') }}"
      no_log: true

    - name: Check whether the new admin password already works
      ansible.builtin.uri:
        url: "https://{{ controller }}/login"
        method: POST
        body_format: json
        body:
          username: "{{ avi_username }}"
          password: "{{ avi_password }}"
        validate_certs: false
        status_code: [200, 401, 403]
      register: login_check
      no_log: true

    - name: Update user admin password
      vmware.alb.avi_useraccount:
        controller: "{{ controller }}"
        username: "{{ avi_username }}"
        password: "{{ avi_password }}"
        old_password: "{{ avi_old_password }}"
        api_version: "{{ avi_version }}"
      when: login_check.status != 200
      no_log: true

    - name: Set variable avi_credentials
      ansible.builtin.set_fact:
        avi_credentials:
          api_version: "{{ avi_version }}"
          controller: "{{ controller }}"
          username: "{{ avi_username }}"
          password: "{{ avi_password }}"
      no_log: true

    # System configuration. The input variables (dns_servers, ntp_servers) and the lists built here have
    # different names on purpose: variables from the extra-vars file cannot be overridden by set_fact.
    - name: Define the DNS server list
      ansible.builtin.set_fact:
        avi_dns_server_list: "{{ avi_dns_server_list | default([]) + [{'type': 'V4', 'addr': item}] }}"
      loop: "{{ dns_servers | default([controller_gateway | default('')], true) | reject('equalto', '') | list }}"

    - name: Define the NTP server list
      ansible.builtin.set_fact:
        avi_ntp_server_list: "{{ avi_ntp_server_list | default([]) + [{'server': {'type': 'V4', 'addr': item}}] }}"
      loop: "{{ ntp_servers | default([controller_gateway | default('')], true) | reject('equalto', '') | list }}"

    # License tier. The controller's default tier (ENTERPRISE_WITH_CLOUD_SERVICES) only works once it is
    # registered with Cloud Services, which takes both a jwt_token and an account_id. Without both
    # (missing, empty or still a <placeholder>) the tier is set to ENTERPRISE; with both it is left alone.
    # An explicit license_tier always wins.
    - name: Work out the license tier to set
      ansible.builtin.set_fact:
        avi_license_tier: >-
          {{ license_tier
             if license_tier is defined and license_tier | length > 0
             else ('' if (jwt_token | default('')) | length > 0 and (jwt_token | default('')) is not match('^<.*>$')
                         and (account_id | default('')) | length > 0 and (account_id | default('')) is not match('^<.*>$')
                   else 'ENTERPRISE') }}

    - name: The license tier is one the controller knows
      ansible.builtin.assert:
        that:
          - avi_license_tier in ['ENTERPRISE_WITH_CLOUD_SERVICES', 'ENTERPRISE', 'ENTERPRISE_18', 'ENTERPRISE_16', 'ESSENTIALS', 'BASIC']
        fail_msg: "license tier '{{ avi_license_tier }}' is not a default_license_tier value"
      when: avi_license_tier | length > 0

    # One PATCH of just these fields, not avi_systemconfiguration: that module PUTs the whole object by
    # default, which would reset every setting not listed here. avi_api_session compares before/after, so
    # `changed` is only reported when something really changed. Only what is known is sent: no DNS/NTP
    # servers -> that part is left alone.
    - name: Define the system configuration changes
      ansible.builtin.set_fact:
        avi_systemconfiguration_changes: >-
          {{ {'welcome_workflow_complete': true}
             | combine({'dns_configuration': {'search_domain': dns_search_domain | default(''), 'server_list': avi_dns_server_list}} if avi_dns_server_list is defined else {})
             | combine({'ntp_configuration': {'ntp_servers': avi_ntp_server_list}} if avi_ntp_server_list is defined else {})
             | combine({'default_license_tier': avi_license_tier} if avi_license_tier | length > 0 else {}) }}

    - name: Apply the system configuration (DNS, NTP, welcome workflow, license tier)
      vmware.alb.avi_api_session:
        avi_credentials: "{{ avi_credentials }}"
        http_method: patch
        path: systemconfiguration
        data:
          replace: "{{ avi_systemconfiguration_changes }}"
      no_log: true

    # The private key is the one whose public half is in the Ubuntu VMs' sshAuthorizedKeys (CR); it is
    # passed as text, not as a file path (the controller derives and stores the public half itself).
    # Skipped when no lsc_private_key is given.
    - name: Create a Cloud connector user for LSC
      vmware.alb.avi_cloudconnectoruser:
        avi_credentials: "{{ avi_credentials }}"
        name: "{{ lsc_user_name | default('credsLsc') }}"
        private_key: "{{ lsc_private_key }}"
      register: lsc_user_output
      tags:
        - cloud
      when: lsc_private_key is defined and lsc_private_key | length > 0
      no_log: true

    # Configuration backups need a passphrase before the controller will encrypt/export them; the admin
    # password is used. The controller ships a default "Backup-Configuration" object, which this updates
    # (save_local keeps the backups on the controller itself).
    - name: Create Backup Configuration passphrase
      vmware.alb.avi_backupconfiguration:
        avi_credentials: "{{ avi_credentials }}"
        state: present
        backup_passphrase: "{{ avi_credentials.password }}"
        name: Backup-Configuration
        save_local: true
      no_log: true

