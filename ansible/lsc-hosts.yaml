---
# needs: controller hosts
# Second step, per site: prepare the Linux server cloud's hosts - the VMs listed under the site's
# `hosts` in the CR, which run.sh turns into the inventory group selsc_<site>. Replaces the old
# "copy keys / linux_host_install" playbook: the hosts come from the CR instead of a hand-made
# inventory, and the old copy of the private key onto the hosts is gone (nothing on the hosts uses it;
# the key stays with the controller's cloud connector user and with run.sh, which logs in with it).
# Needs the cloud connector user created by base.yaml and Docker on the hosts (docker.yaml). NOT TESTED against hosts/controllers yet.
- hosts: "selsc_{{ site }}"
  become: true
  gather_facts: false

  vars:
    lsc_user: "{{ lsc_user_name | default('credsLsc') }}"

  tasks:
    # The controller serves an install script for the host (documented as
    # `curl -ks https://<controller>/api/linux_host_install?username=<user> | sudo bash`). It embeds the
    # connector user's public key, so base.yaml must have stored one. Strict on purpose: an HTTP error (-f)
    # or an answer that is not a script stops the task and writes no marker - before, an error page was
    # piped to bash and the marker was written anyway. The marker file keeps a re-run from running the
    # script again (it is not known to be idempotent); it is a new name on purpose, so the markers left by
    # the earlier, unchecked version of this task don't count.
    - name: Run the controller's linux host install script
      ansible.builtin.shell: |
        set -eo pipefail
        script="$(curl -ksSf "https://{{ controller }}:443/api/linux_host_install?username={{ lsc_user }}")"
        case "${script}" in
          "#!"*) ;;
          *) echo "linux_host_install did not return a script: ${script:0:200}" >&2; exit 1 ;;
        esac
        printf '%s\n' "${script}" | bash
        touch /var/lib/avi-linux-host-install.ok
      args:
        executable: /bin/bash
        creates: /var/lib/avi-linux-host-install.ok
